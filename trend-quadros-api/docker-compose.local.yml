services:
  # Banco de dados PostgreSQL para desenvolvimento local
  postgres:
    image: postgres:15-alpine
    container_name: trend_quadros_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=pt_BR.UTF-8 --lc-ctype=pt_BR.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
      - ./src/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trend_quadros_local

  # API NestJS para desenvolvimento local
  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: trend_quadros_api_local
    restart: unless-stopped
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dashboard
      DB_USER: postgres
      DB_PASSWORD: postgres123
      
      # API Configuration
      PORT: 3001
      NODE_ENV: development
      
      # JWT Configuration
      JWT_SECRET: trend_quadros_jwt_secret_2024_local_development
      JWT_EXPIRES_IN: 24h
      
      # Tiny API Configuration (usar token real ou de teste)
      TINY_API_TOKEN: ${TINY_API_TOKEN:-a8dfc864f05313e7f9285f6bae3c000120a56c4ad596c62ec9b7ce62a7e9272b}
      
      # CORS Configuration
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      
      # Sync Configuration
      AUTO_START_SYNC: "true"
      RUN_INITIAL_SYNC: "false"
      SYNC_INTERVAL_DEV: 60000
      SYNC_INTERVAL_PROD: 900000
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trend_quadros_local
    volumes:
      # Montar código fonte para hot reload
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "start:dev"]

  # Frontend para desenvolvimento local (opcional)
  frontend:
    build:
      context: ../trend-quadros-dashboard
      dockerfile: Dockerfile.local
    container_name: trend_quadros_frontend_local
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_API_BASE_URL: http://localhost:3001/api
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - trend_quadros_local
    volumes:
      - ../trend-quadros-dashboard:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  postgres_local_data:
    driver: local

networks:
  trend_quadros_local:
    driver: bridge
